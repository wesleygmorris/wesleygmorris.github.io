career-profile:
    title: Career Profile
    summary: |
      Ph.D. candidate specializing in deploying transformer-based large language models and multimodal machine learning to 
      transform educational assessment and learning science. Leading research at the intersection of AI, psychometrics, and 
      education with expertise in automated text evaluation, intelligent question generation, and acoustic speech analysis. 
      Proven track record in developing scalable solutions: recipient of NSF I-Corps Grant ($50K) and multiple academic 
      awards. Proficient in advanced statistical methodologies including Multi-Level Modeling, Item Response Theory, and 
      Structural Equation Modeling to solve complex problems of measurement reliability and validity across research and 
      operational contexts. 
education:
    title: Education
    info:
      - degree: PhD in Psychology and Human Development
        university: Vanderbilt University
        time: 2022 - present
        details: |
          I work with Professor Scott Crossley in the LEAR Lab on iTELL, a
          framework for automatically generating intelligent interactive
          webapps from static texts. I am interested in and have completed
          coursework (GPA: 3.9) in:
            - Structural Equation Modeling
            - Item Response Theory
            - Multi-level Modeling
            - Deep Learning
            - Cognitive Science
      - degree: MA in Applied Linguistics
        university: Georgia State University
        time: 2009 - 2011
        details: |
          Completed 36 credit-hours of coursework, 45 hours of observation and 
          practice teaching under a master teacher, 90 hours of independent teaching, 
          eight individual extra-curricular professional development experiences, 
          and the development of a portfolio. Completed coursework in:
            - Corpus Linguistics
            - Second Language Acquisition
            - Phonology
            - Grammar/Syntax
      - degree: BA in Psychology
        university: Charter Oak State College
        time: 2005 - 2009
        details: |
          Graduated cum laude (GPA: 3.78). Member, Alpha Sigma Lambda Honor Society.


experiences:
    title: Research Experience
    info:
      - role: PhD Research Assistant & AI Research Lead
        time: 2022 - Present
        company: Vanderbilt University, Nashville TN
        details: |
          Leading multiple high-impact NLP and educational technology projects under Prof. Scott Crossley:
          - **Feedback Competition Lead**: Architected AI-driven essay annotation system for automated discourse-level analysis. Engineered Python/R pipelines for large-scale corpus analysis, resulting in NAEP Math Challenge Grand Prize (2023).
          - **iTELL Framework Co-Developer & CEO**: Spearheading development of intelligent textbook platform generating interactive, adaptive learning experiences from expository texts. Scaled to multiple institutional deployments with measurable learning gains.
      - role: 21st Century World Track Lead for Tools Competition
        time: 2022 - Present
        company: The Learning Agency
        details: |
          Lead strategic initiatives for Schmidt Futures-funded $5M+ Tools Competition advancing educational technology innovation. 
          Curate, evaluate, and mentor high-potential EdTech startups in assessment and learning science. Advisory role shaping 
          the future of AI-driven educational tools.
      - role: Graduate Research Assistant
        time: 2011 - 2013
        company: Georgia State University, Atlanta GA
        details: |
          Worked under Professor Scott Crossley, helping him with data analysis, transcription, 
          research, and essay rating according to analytic rubrics.

teaching-experience:
    title: Teaching Experience
    info:
      - role: Teaching Assistant, Graduate NLP Course
        time: 2023 - Present
        company: Vanderbilt University
        details: |
          Lead lecture sessions and design curriculum on tokenization, embeddings, transformer architectures,
          and LLM fine-tuning. Mentor students on implementing and debugging Python-based NLP projects (SpaCy, Hugging Face).
      - role: Grammar & Writing Instructor
        time: 2020 - 2022
        company: CMCH Middle School
        details: |
          Developed and delivered a functional grammar curriculum to improve students' analytical writing across genres.
      - role: Upper Primary Teacher
        time: 2015 - 2020
        company: International Montessori School of Hong Kong
        details: |
          Led a Montessori classroom and delivered professional development courses on English grammar and EAL
          instruction.
      - role: Head of English
        time: 2013 - 2015
        company: Montessori School of Beijing
        details: |
          Coordinated the English department, developed a Communicative Language Teaching curriculum for ages 6-12,
          and created a reading instruction program. Trained teachers as a certified "How Language Works" tutor.

