projects:
    title: Projects
    intro: >
      Developing cutting-edge NLP and machine learning solutions that bridge artificial intelligence 
      and educational science. Currently leading initiatives at Vanderbilt University that leverage transformers, 
      multimodal learning, and advanced analytics to solve critical challenges in assessment and learning.
    assignments:
      - title: iTELL Framework
        link: "https://learlab.org/itellguide/about/about/"
        tagline: "AI-powered intelligent tutoring system generating adaptive, interactive learning experiences from static texts. Deployed across multiple institutions with demonstrated learning improvements."

      - title: MASCoT-CP (Multimodal Assessment System for Classroom Teaching)
        link: "#"
        tagline: "Co-PI on NSF-funded initiative developing multimodal machine learning models to automatically classify and evaluate teacher instructional practices from video and audio data. Finalist for $150K Tools Competition grant."

      - title: Metacognitive Strategies Detection
        link: "#"
        tagline: "Co-PI on project leveraging NLP and transfer learning to automatically identify and classify evidence of metacognitive thinking in student writing. Advancing measurement of higher-order learning processes."


